name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install '.[test]' build
      - run: python -m pytest -q
      - run: python -m build
      - run: docker build -t litellm-admin-mcp:smoke .
      - run: python scripts/smoke_container.py
