[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "litellm-admin-mcp"
version = "0.1.0"
description = "An MCP connector for administering your LiteLLM gateway"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Berri AI"}]
dependencies = ["mcp==2.2.0", "httpx2==2.13.0", "jsonschema==4.26.0", "uvicorn>=0.30,<1"]

[project.optional-dependencies]
test = ["pytest==9.1.1", "pytest-asyncio==1.4.0", "aiohttp==3.14.3"]

[project.scripts]
litellm-admin-mcp = "litellm_admin_mcp.__main__:main"

[project.urls]
Homepage = "https://github.com/BerriAI/litellm-admin-mcp"
Issues = "https://github.com/BerriAI/litellm-admin-mcp/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/litellm_admin_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
